on:
  push:
    branches:
      - master
  pull_request:

name: test
jobs:
  test:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Install Go
        uses: actions/setup-go@v5.0.2
        with:
          go-version: "stable"
          check-latest: true
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Test
        run: go test ./...
